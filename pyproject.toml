[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "frb_atlas"
version = "0.1.0"
description = "A reproducible reanalysis of CHIME/FRB Catalog 1: repeater vs. non-repeater burst statistics"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "David Lindgreen" }]
keywords = ["fast-radio-bursts", "chime-frb", "astrostatistics", "radio-astronomy", "reproducible-research"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.26,<2.3", "scipy>=1.11,<2"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "hatchling>=1.27",
  "mypy>=1.13,<3",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[project.scripts]
frb-atlas = "frb_atlas.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/frb_atlas"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=frb_atlas --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["frb_atlas"]

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true
